<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <!-- 店内: 焦茶〜深い茶 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241710"/>
      <stop offset="0.55" stop-color="#3A2A1E"/>
      <stop offset="1" stop-color="#2A1D14"/>
    </linearGradient>
    <!-- 窓の外: 茜色の朝焼け -->
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C39A"/>
      <stop offset="0.45" stop-color="#DD8743"/>
      <stop offset="0.8" stop-color="#C2632B"/>
      <stop offset="1" stop-color="#A8511F"/>
    </linearGradient>
    <!-- 窓から店内へ広がる朝日のグロー -->
    <radialGradient id="glow" cx="0.78" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#C2632B" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#C2632B" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C2632B" stop-opacity="0"/>
    </radialGradient>
    <!-- 焙煎機の丸胴 -->
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A4028"/>
      <stop offset="0.55" stop-color="#3A2A1E"/>
      <stop offset="1" stop-color="#241710"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 床板 -->
  <rect y="790" width="1600" height="210" fill="#20130C"/>
  <g stroke="#3A2A1E" stroke-width="3" stroke-opacity="0.6">
    <path d="M0 850 H1600"/>
    <path d="M0 915 H1600"/>
    <path d="M0 975 H1600"/>
  </g>

  <!-- 窓と茜色の朝日（右） -->
  <g>
    <rect x="1030" y="120" width="440" height="540" rx="10" fill="#1A0F08"/>
    <rect x="1054" y="144" width="392" height="492" fill="url(#dawn)"/>
    <!-- 遠景の街並みの影 -->
    <path d="M1054 560 L1130 522 L1130 560 L1196 500 L1196 560 L1290 530 L1352 488 L1352 560 L1446 516 L1446 636 L1054 636 Z" fill="#8F410F" fill-opacity="0.55"/>
    <!-- 朝日 -->
    <circle cx="1250" cy="486" r="118" fill="#F6D7A8" fill-opacity="0.25"/>
    <circle cx="1250" cy="486" r="84" fill="#F6D7A8"/>
    <!-- 窓の桟 -->
    <g fill="#1A0F08">
      <rect x="1238" y="144" width="24" height="492"/>
      <rect x="1054" y="378" width="392" height="24"/>
    </g>
  </g>

  <!-- 窓から床へ伸びる光のシャフト -->
  <path d="M1054 220 L560 1000 H1300 L1446 250 Z" fill="#C2632B" fill-opacity="0.1"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- 棚: 豆袋とカップのシルエット（中央） -->
  <g>
    <rect x="600" y="312" width="380" height="220" fill="#C2632B" fill-opacity="0.08"/>
    <!-- 上段: カップ -->
    <rect x="600" y="326" width="380" height="14" rx="4" fill="#1A0F08"/>
    <g fill="#190E07">
      <path d="M636 282 h52 v26 a14 14 0 0 1 -14 14 h-24 a14 14 0 0 1 -14 -14 Z"/>
      <path d="M688 288 h12 a10 10 0 0 1 0 20 h-12 Z"/>
      <path d="M732 282 h52 v26 a14 14 0 0 1 -14 14 h-24 a14 14 0 0 1 -14 -14 Z"/>
      <path d="M784 288 h12 a10 10 0 0 1 0 20 h-12 Z"/>
      <path d="M838 270 h56 v34 a16 16 0 0 1 -16 16 h-24 a16 16 0 0 1 -16 -16 Z"/>
    </g>
    <!-- 下段: 豆袋 -->
    <rect x="600" y="518" width="380" height="14" rx="4" fill="#1A0F08"/>
    <g>
      <path d="M636 518 C632 462 648 438 682 438 C716 438 732 462 728 518 Z" fill="#7C5A3C"/>
      <rect x="662" y="430" width="40" height="16" rx="7" fill="#5A4028"/>
      <path d="M756 518 C752 470 766 450 796 450 C826 450 840 470 836 518 Z" fill="#8F5A33"/>
      <rect x="780" y="442" width="34" height="14" rx="6" fill="#6B3A1F"/>
      <path d="M862 518 C858 474 872 456 900 456 C928 456 942 474 938 518 Z" fill="#6B4A2E"/>
      <rect x="884" y="448" width="32" height="14" rx="6" fill="#4A3220"/>
    </g>
  </g>

  <!-- 焙煎機（左・丸胴） -->
  <g>
    <!-- 湯気 -->
    <g stroke="#F0C39A" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M320 150 C 292 108, 348 82, 320 40"/>
      <path d="M388 150 C 360 110, 414 84, 388 44"/>
      <path d="M252 168 C 228 132, 274 110, 252 76"/>
    </g>
    <!-- ホッパー（投入漏斗） -->
    <rect x="258" y="158" width="184" height="20" rx="8" fill="#1A0F08"/>
    <path d="M272 178 L428 178 L384 262 L316 262 Z" fill="#4A3220"/>
    <rect x="304" y="262" width="92" height="112" fill="#2E2014"/>
    <!-- 丸胴ドラム -->
    <circle cx="350" cy="570" r="200" fill="url(#drum)"/>
    <circle cx="350" cy="570" r="200" fill="none" stroke="#1A0F08" stroke-width="6"/>
    <circle cx="350" cy="570" r="148" fill="#241710" stroke="#5A4028" stroke-width="4"/>
    <!-- 前面の窯口: 火の灯り -->
    <circle cx="350" cy="570" r="66" fill="#1A0F08"/>
    <circle cx="350" cy="570" r="46" fill="#C2632B"/>
    <circle cx="350" cy="578" r="24" fill="#F0C39A"/>
    <!-- ハンドルとビス -->
    <path d="M448 510 L506 478" stroke="#5A4028" stroke-width="10" stroke-linecap="round"/>
    <g fill="#5A4028">
      <circle cx="350" cy="438" r="6"/>
      <circle cx="350" cy="702" r="6"/>
      <circle cx="218" cy="570" r="6"/>
      <circle cx="482" cy="570" r="6"/>
    </g>
    <!-- 脚と土台 -->
    <rect x="238" y="724" width="18" height="78" fill="#1A0F08"/>
    <rect x="444" y="724" width="18" height="78" fill="#1A0F08"/>
    <rect x="198" y="796" width="320" height="16" rx="6" fill="#1A0F08"/>
  </g>
</svg>
