<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A3220"/>
      <stop offset="0.55" stop-color="#3A2A1E"/>
      <stop offset="1" stop-color="#2A1D14"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.32" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#C2632B" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#C2632B" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#C2632B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A4A28"/>
      <stop offset="1" stop-color="#4A2C18"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="url(#bg)"/>
  <rect width="800" height="900" fill="url(#warm)"/>

  <!-- steam -->
  <g stroke="#F0C39A" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M360 250 C 330 210, 390 180, 360 140 C 335 108, 388 80, 362 44"/>
    <path d="M440 250 C 412 212, 468 184, 440 146 C 416 116, 462 92, 440 60"/>
  </g>

  <!-- coffee beans -->
  <g>
    <g transform="translate(300 470) rotate(-24)">
      <ellipse rx="92" ry="58" fill="url(#bean)"/>
      <path d="M0 -54 C 22 -28, 22 28, 0 54" fill="none" stroke="#2A1810" stroke-width="6" stroke-opacity="0.7"/>
      <ellipse rx="92" ry="58" fill="none" stroke="#1F120B" stroke-width="3" stroke-opacity="0.5"/>
    </g>
    <g transform="translate(470 590) rotate(18)">
      <ellipse rx="100" ry="62" fill="url(#bean)"/>
      <path d="M0 -58 C 24 -30, 24 30, 0 58" fill="none" stroke="#2A1810" stroke-width="6" stroke-opacity="0.7"/>
      <ellipse rx="100" ry="62" fill="none" stroke="#1F120B" stroke-width="3" stroke-opacity="0.5"/>
    </g>
    <g transform="translate(360 700) rotate(-8)">
      <ellipse rx="80" ry="50" fill="url(#bean)"/>
      <path d="M0 -46 C 19 -24, 19 24, 0 46" fill="none" stroke="#2A1810" stroke-width="5" stroke-opacity="0.7"/>
      <ellipse rx="80" ry="50" fill="none" stroke="#1F120B" stroke-width="3" stroke-opacity="0.5"/>
    </g>
  </g>

  <!-- accent ring -->
  <circle cx="400" cy="560" r="320" fill="none" stroke="#C2632B" stroke-opacity="0.12" stroke-width="2"/>
</svg>
