<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#26352F"/>
      <stop offset="0.5" stop-color="#1F2A28"/>
      <stop offset="1" stop-color="#141C1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.26" r="0.6">
      <stop offset="0" stop-color="#CDBB9C" stop-opacity="0.5"/>
      <stop offset="0.38" stop-color="#A88B6A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A88B6A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#F6F1E8"/>
      <stop offset="0.7" stop-color="#E4D6BE"/>
      <stop offset="1" stop-color="#C9B591"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="2000" fill="url(#bg)"/>
  <rect width="1600" height="2000" fill="url(#glow)"/>

  <!-- moon (月白) -->
  <circle cx="1180" cy="520" r="250" fill="url(#moon)" opacity="0.95"/>
  <circle cx="1180" cy="520" r="250" fill="none" stroke="#F6F1E8" stroke-opacity="0.12" stroke-width="2"/>

  <!-- faint orbital ring -->
  <circle cx="1180" cy="520" r="360" fill="none" stroke="#CDBB9C" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- soft mist bands -->
  <g stroke="#CDBB9C" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <path d="M0 1180 C 420 1140, 1180 1230, 1600 1175"/>
    <path d="M0 1300 C 500 1270, 1100 1345, 1600 1295"/>
    <path d="M0 1430 C 380 1400, 1220 1470, 1600 1420"/>
  </g>

  <!-- botanical branch, lower area -->
  <g stroke="#A88B6A" stroke-opacity="0.22" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M250 2000 C 300 1720, 360 1560, 470 1400"/>
    <path d="M360 1700 C 300 1640, 250 1620, 200 1640"/>
    <path d="M390 1600 C 450 1540, 500 1520, 560 1535"/>
    <path d="M420 1500 C 360 1450, 312 1432, 270 1448"/>
  </g>
  <g fill="#A88B6A" fill-opacity="0.16">
    <ellipse cx="196" cy="1636" rx="40" ry="15" transform="rotate(-28 196 1636)"/>
    <ellipse cx="566" cy="1532" rx="42" ry="15" transform="rotate(24 566 1532)"/>
    <ellipse cx="262" cy="1446" rx="38" ry="14" transform="rotate(-32 262 1446)"/>
  </g>
</svg>
