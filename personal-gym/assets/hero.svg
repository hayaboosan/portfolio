<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1A1C1E"/>
      <stop offset="0.55" stop-color="#121315"/>
      <stop offset="1" stop-color="#0B0C0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#C8FF00" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#C8FF00" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#C8FF00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8FF00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C8FF00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C8FF00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2000" fill="url(#bg)"/>
  <rect width="1600" height="2000" fill="url(#glow)"/>

  <!-- diagonal grid lines (energetic, technical feel) -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5">
    <path d="M-200 400 L1800 -200"/>
    <path d="M-200 700 L1800 100"/>
    <path d="M-200 1000 L1800 400"/>
    <path d="M-200 1300 L1800 700"/>
    <path d="M-200 1600 L1800 1000"/>
    <path d="M-200 1900 L1800 1300"/>
  </g>

  <!-- bold lime diagonal streaks -->
  <g>
    <rect x="900" y="-300" width="60" height="2600" fill="url(#streak)" transform="rotate(24 1200 1000)"/>
    <rect x="1180" y="-300" width="22" height="2600" fill="url(#streak)" transform="rotate(24 1200 1000)" opacity="0.7"/>
  </g>

  <!-- abstract barbell mark, upper right -->
  <g transform="translate(1150 470)" stroke="#C8FF00" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="-150" y1="0" x2="150" y2="0"/>
    <line x1="-150" y1="-55" x2="-150" y2="55"/>
    <line x1="150" y1="-55" x2="150" y2="55"/>
    <line x1="-195" y1="-35" x2="-195" y2="35"/>
    <line x1="195" y1="-35" x2="195" y2="35"/>
  </g>

  <!-- pulse / heartbeat line, lower area -->
  <g stroke="#C8FF00" stroke-opacity="0.32" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 1560 H520 L600 1380 L700 1740 L800 1300 L880 1560 H1600"/>
  </g>

  <!-- corner accent block -->
  <rect x="0" y="1900" width="240" height="14" fill="#C8FF00" fill-opacity="0.5"/>
</svg>
