<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
  <!-- =========================================================
       Atelier Lumen — ヒーロー用イラスト（自作・フラット）
       上から見たアトリエの机：開いたノートと万年筆、コーヒー、積んだ書籍
       紺×金（#16213E / #D4A94E 系）の落ち着いた配色
       ========================================================= -->

  <!-- 机の天板（深い紺）と、木目を思わせる極薄の筋 -->
  <rect width="900" height="1100" fill="#16213E"/>
  <g stroke="#1E2C52" stroke-width="3" opacity="0.6">
    <line x1="0" y1="140" x2="900" y2="120"/>
    <line x1="0" y1="560" x2="900" y2="540"/>
    <line x1="0" y1="980" x2="900" y2="960"/>
  </g>

  <!-- ランタンの灯を思わせる光だまり -->
  <circle cx="430" cy="450" r="430" fill="#D4A94E" opacity="0.05"/>
  <circle cx="430" cy="450" r="290" fill="#D4A94E" opacity="0.05"/>

  <!-- 開いたノート（中央・わずかに傾ける） -->
  <g transform="rotate(-4 450 480)">
    <!-- 落ち影 -->
    <rect x="160" y="270" width="586" height="436" rx="10" fill="#0D1730" opacity="0.85"/>
    <!-- 左右のページと綴じ目 -->
    <rect x="172" y="258" width="278" height="424" rx="6" fill="#F2ECDC"/>
    <rect x="450" y="258" width="278" height="424" rx="6" fill="#EAE2CE"/>
    <rect x="444" y="258" width="12" height="424" fill="#CFC4A6"/>
    <!-- 左ページの罫線 -->
    <g stroke="#A8B0C6" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="200" y1="320" x2="424" y2="320"/>
      <line x1="200" y1="370" x2="424" y2="370"/>
      <line x1="200" y1="420" x2="424" y2="420"/>
      <line x1="200" y1="470" x2="424" y2="470"/>
      <line x1="200" y1="520" x2="424" y2="520"/>
      <line x1="200" y1="570" x2="424" y2="570"/>
      <line x1="200" y1="620" x2="424" y2="620"/>
    </g>
    <!-- 右ページの書きかけのメモ（紺のインク）と、金の下線 -->
    <g stroke="#3A4C7E" stroke-width="5" stroke-linecap="round">
      <line x1="478" y1="322" x2="640" y2="322"/>
      <line x1="478" y1="372" x2="700" y2="372"/>
      <line x1="478" y1="422" x2="664" y2="422"/>
      <line x1="478" y1="472" x2="596" y2="472"/>
    </g>
    <line x1="478" y1="500" x2="596" y2="500" stroke="#D4A94E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 万年筆（右ページの上に斜めに置く・金のニブ） -->
  <g transform="rotate(38 600 560)">
    <rect x="455" y="544" width="200" height="30" rx="15" fill="#0E1834"/>
    <rect x="540" y="544" width="12" height="30" fill="#D4A94E"/>
    <rect x="655" y="549" width="36" height="20" rx="4" fill="#2C3A60"/>
    <path d="M691 549 L737 559 L691 569 Z" fill="#D4A94E"/>
    <line x1="700" y1="559" x2="730" y2="559" stroke="#16213E" stroke-width="2"/>
  </g>

  <!-- コーヒー（右上・真上から見たカップとソーサー） -->
  <g>
    <circle cx="700" cy="180" r="98" fill="#0F1A38"/>
    <circle cx="700" cy="180" r="86" fill="#F2ECDC"/>
    <circle cx="772" cy="180" r="20" fill="none" stroke="#E5DCC4" stroke-width="12"/>
    <circle cx="700" cy="180" r="56" fill="#E5DCC4"/>
    <circle cx="700" cy="180" r="46" fill="#3B2B1C"/>
    <!-- クレマの揺らぎ -->
    <path d="M676 192 q14 -26 48 -22" fill="none" stroke="#D4A94E" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 積んだ書籍（左下・真上から見た重なり） -->
  <g>
    <!-- いちばん下の一冊 -->
    <g transform="rotate(7 265 905)">
      <rect x="105" y="790" width="320" height="230" rx="6" fill="#233566"/>
      <rect x="105" y="790" width="22" height="230" rx="6" fill="#1A2848"/>
    </g>
    <!-- 2冊目 -->
    <g transform="rotate(-4 265 905)">
      <rect x="118" y="798" width="300" height="218" rx="6" fill="#2E4070"/>
      <rect x="118" y="798" width="20" height="218" rx="6" fill="#24345C"/>
    </g>
    <!-- いちばん上（金の背・題字・栞リボン） -->
    <g transform="rotate(2 265 905)">
      <rect x="300" y="990" width="14" height="60" fill="#D4A94E" opacity="0.8"/>
      <rect x="130" y="806" width="284" height="206" rx="6" fill="#1E2C52"/>
      <rect x="130" y="806" width="18" height="206" rx="6" fill="#D4A94E" opacity="0.9"/>
      <rect x="160" y="836" width="226" height="146" fill="none" stroke="#D4A94E" stroke-width="2" opacity="0.35"/>
      <rect x="196" y="868" width="160" height="8" rx="4" fill="#D4A94E" opacity="0.85"/>
      <rect x="196" y="894" width="110" height="8" rx="4" fill="#D4A94E" opacity="0.55"/>
    </g>
  </g>

  <!-- 灯の粒（余白に散らした小さな金の点） -->
  <g fill="#D4A94E">
    <circle cx="120" cy="150" r="4" opacity="0.5"/>
    <circle cx="170" cy="110" r="2.5" opacity="0.35"/>
    <circle cx="820" cy="420" r="3" opacity="0.4"/>
    <circle cx="780" cy="660" r="4" opacity="0.45"/>
    <circle cx="560" cy="930" r="3" opacity="0.4"/>
    <circle cx="640" cy="980" r="2.5" opacity="0.3"/>
  </g>
</svg>
