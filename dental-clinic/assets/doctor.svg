<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720">
  <!-- 院長（架空の人物）のフラットなイラストポートレート。目鼻を省いた抽象スタイル -->

  <!-- 背景（淡いミント〜空色のトーン） -->
  <rect width="640" height="720" fill="#eef7fb"/>
  <circle cx="320" cy="340" r="256" fill="#dff0e8"/>
  <circle cx="540" cy="120" r="70" fill="#bfe3c4" opacity="0.45"/>
  <circle cx="90" cy="560" r="90" fill="#cde9f6" opacity="0.6"/>

  <!-- 後ろ髪 -->
  <path d="M168 282c0-104 68-166 152-166s152 62 152 166v196c0 24-19 43-43 43H211c-24 0-43-19-43-43Z" fill="#6e5546"/>

  <!-- 首 -->
  <rect x="290" y="350" width="60" height="86" rx="24" fill="#efc4a8"/>

  <!-- 顔（目鼻は省略） -->
  <ellipse cx="320" cy="278" rx="94" ry="102" fill="#f7d9c4"/>

  <!-- 前髪 -->
  <path d="M226 268c-4-92 52-128 94-128s98 36 94 128c-26-44-44-58-94-58s-68 14-94 58Z" fill="#7a6053"/>

  <!-- ほお -->
  <circle cx="266" cy="306" r="13" fill="#f2b49b" opacity="0.55"/>
  <circle cx="374" cy="306" r="13" fill="#f2b49b" opacity="0.55"/>

  <!-- 白衣 -->
  <path d="M118 720c12-152 84-232 202-232s190 80 202 232Z" fill="#ffffff"/>

  <!-- インナー（スクラブ） -->
  <path d="M320 564l-46-56c14-12 30-18 46-18s32 6 46 18Z" fill="#2f9bd6"/>

  <!-- 白衣の襟 -->
  <path d="M272 508l48 60-28 22-46-64c8-7 17-13 26-18Z" fill="#f4f9fc"/>
  <path d="M368 508l-48 60 28 22 46-64c-8-7-17-13-26-18Z" fill="#f4f9fc"/>

  <!-- 胸元のネームプレート（控えめな装い） -->
  <rect x="398" y="612" width="66" height="20" rx="10" fill="#bfe3c4"/>
</svg>
