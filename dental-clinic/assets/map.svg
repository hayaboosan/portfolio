<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="そよかぜ歯科・矯正歯科の簡易地図。みどり野駅 北口から徒歩3分、けやき通り沿い、さくら公園の向かい。">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7f1"/>
      <stop offset="1" stop-color="#e6f3ee"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#land)"/>

  <!-- 街区内の建物（雰囲気づくり） -->
  <g fill="#dcebe2">
    <rect x="40" y="56" width="60" height="44" rx="3"/>
    <rect x="128" y="40" width="56" height="40" rx="3"/>
    <rect x="44" y="128" width="52" height="40" rx="3"/>
    <rect x="430" y="44" width="60" height="44" rx="3"/>
    <rect x="516" y="104" width="54" height="40" rx="3"/>
    <rect x="248" y="288" width="56" height="42" rx="3"/>
  </g>

  <!-- roads -->
  <!-- けやき通り（横の大通り・画面端まで連続） -->
  <rect x="0" y="210" width="600" height="46" fill="#ffffff"/>
  <line x1="0" y1="233" x2="600" y2="233" stroke="#d7c98a" stroke-width="3" stroke-dasharray="18 14"/>
  <text x="62" y="250" font-family="sans-serif" font-size="14" fill="#8a7d4a" text-anchor="middle">けやき通り</text>

  <!-- 縦の通り（画面端まで連続） -->
  <rect x="360" y="0" width="40" height="400" fill="#ffffff"/>
  <line x1="380" y1="0" x2="380" y2="400" stroke="#d7c98a" stroke-width="3" stroke-dasharray="16 12"/>

  <!-- さくら公園（けやき通りをはさんで歯科の向かい） -->
  <rect x="50" y="272" width="170" height="102" rx="14" fill="#bfe3c4"/>
  <circle cx="90" cy="304" r="13" fill="#8fcf99"/>
  <circle cx="136" cy="336" r="15" fill="#8fcf99"/>
  <circle cx="182" cy="300" r="11" fill="#8fcf99"/>
  <text x="135" y="362" font-family="sans-serif" font-size="15" fill="#3f7a4a" text-anchor="middle">さくら公園</text>

  <!-- 鉄道（東西に走る） -->
  <line x1="0" y1="386" x2="600" y2="386" stroke="#9aa2a8" stroke-width="8"/>
  <line x1="0" y1="386" x2="600" y2="386" stroke="#ffffff" stroke-width="3" stroke-dasharray="9 9"/>

  <!-- みどり野駅（線路沿い・縦の通りに面する） -->
  <rect x="420" y="300" width="150" height="72" rx="12" fill="#9bc7e8"/>
  <path d="M440 300 v-16 h110 v16" fill="none" stroke="#5a92bd" stroke-width="4"/>
  <text x="495" y="342" font-family="sans-serif" font-size="15" fill="#234a66" text-anchor="middle">みどり野駅</text>
  <rect x="432" y="291" width="34" height="17" rx="8" fill="#ffffff" stroke="#5a92bd" stroke-width="1.5"/>
  <text x="449" y="304" font-family="sans-serif" font-size="10" fill="#234a66" text-anchor="middle">北口</text>

  <!-- clinic pin -->
  <g transform="translate(250 150)">
    <rect x="-58" y="-2" width="116" height="58" rx="10" fill="#ffffff" stroke="#2f9bd6" stroke-width="3"/>
    <text x="0" y="22" font-family="sans-serif" font-size="14" fill="#1c6e9c" text-anchor="middle" font-weight="bold">そよかぜ</text>
    <text x="0" y="42" font-family="sans-serif" font-size="13" fill="#1c6e9c" text-anchor="middle">歯科</text>
    <!-- pin marker -->
    <path d="M0 -8 C -22 -8, -30 -28, -16 -44 C -8 -54, 8 -54, 16 -44 C 30 -28, 22 -8, 0 -8 Z" fill="#ff9f3e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="-32" r="7" fill="#ffffff"/>
  </g>

  <!-- 徒歩ルート（北口→駅前広場→縦の通り→けやき通り→歯科） -->
  <path d="M446 288 C 424 274, 400 260, 388 240 L 388 224 L 268 224 L 268 208" fill="none" stroke="#2f9bd6" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
  <text x="334" y="250" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f9bd6" text-anchor="middle">徒歩3分</text>
</svg>
