<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" preserveAspectRatio="xMidYMid slice">
  <rect width="380" height="200" fill="#eef1e6"/>
  <!-- 道路 -->
  <rect x="0" y="84" width="380" height="30" fill="#ffffff" stroke="#d2d6c4" stroke-width="2"/>
  <rect x="150" y="0" width="26" height="200" fill="#ffffff" stroke="#d2d6c4" stroke-width="2"/>
  <line x1="0" y1="99" x2="380" y2="99" stroke="#e3c84d" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- 線路と駅 -->
  <rect x="0" y="150" width="380" height="16" fill="#cfd3c4"/>
  <line x1="0" y1="158" x2="380" y2="158" stroke="#9aa088" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="40" y="138" width="74" height="22" fill="#7d8aa8"/>
  <text x="77" y="153" text-anchor="middle" font-family="'MS PGothic',sans-serif" font-size="12" fill="#ffffff">わかば駅</text>
  <!-- 当院マーカー -->
  <g transform="translate(238,60)">
    <path d="M0 34 C -16 12 -16 -4 0 -4 C 16 -4 16 12 0 34 Z" fill="#d23b3b"/>
    <circle cx="0" cy="9" r="7" fill="#ffffff"/>
  </g>
  <rect x="206" y="92" width="70" height="20" fill="#fff6d8" stroke="#d9b94a" stroke-width="1"/>
  <text x="241" y="106" text-anchor="middle" font-family="'MS PGothic',sans-serif" font-size="12" fill="#9a6a16" font-weight="bold">当院</text>
  <!-- 簡易ビル -->
  <rect x="300" y="40" width="40" height="34" fill="#dfe3d4" stroke="#c2c8b2" stroke-width="1"/>
  <rect x="30" y="40" width="40" height="30" fill="#dfe3d4" stroke="#c2c8b2" stroke-width="1"/>
</svg>
