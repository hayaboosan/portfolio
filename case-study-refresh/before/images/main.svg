<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff0d8"/>
      <stop offset="1" stop-color="#bfe0bf"/>
    </linearGradient>
  </defs>
  <rect width="600" height="160" fill="url(#sky)"/>
  <!-- 地面 -->
  <rect y="120" width="600" height="40" fill="#a5cba5"/>
  <!-- 大きな若葉 -->
  <g transform="translate(95,80)">
    <path d="M0 40 C -10 -20 30 -55 70 -50 C 66 -8 40 36 0 40 Z" fill="#5aa45e" stroke="#3f8a43" stroke-width="2"/>
    <path d="M5 34 C 18 6 36 -16 60 -40" fill="none" stroke="#eaf6ea" stroke-width="2"/>
  </g>
  <!-- テキスト -->
  <text x="210" y="66" font-family="'MS PGothic','Hiragino Kaku Gothic Pro',sans-serif" font-size="30" font-weight="bold" fill="#1b5e20">健康な毎日を、わかばと。</text>
  <text x="212" y="100" font-family="'MS PGothic',sans-serif" font-size="16" fill="#4a7a4d">肩こり・腰痛・スポーツ障害・交通事故のケアまで</text>
  <!-- 角の飾り -->
  <rect x="0" y="0" width="600" height="160" fill="none" stroke="#8fbf8f" stroke-width="3"/>
</svg>
