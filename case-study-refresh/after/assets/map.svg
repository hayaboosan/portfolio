<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="">
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6F5"/>
      <stop offset="1" stop-color="#E2EFED"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#mapbg)"/>

  <!-- roads -->
  <g stroke="#FFFFFF" stroke-width="26">
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>
  <g stroke="#D8C9AE" stroke-width="14">
    <line x1="220" y1="120" x2="800" y2="120"/>
    <line x1="280" y1="0" x2="280" y2="480"/>
  </g>

  <!-- park / green block -->
  <rect x="40" y="40" width="180" height="150" rx="10" fill="#C7E6C9"/>
  <text x="130" y="120" font-family="sans-serif" font-size="18" fill="#3A6B4A" text-anchor="middle">わかば公園</text>

  <!-- water -->
  <rect x="600" y="300" width="180" height="150" rx="10" fill="#BFE0EC"/>

  <!-- station -->
  <rect x="60" y="290" width="150" height="60" rx="8" fill="#5A6B7A"/>
  <text x="135" y="328" font-family="sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">わかば駅</text>

  <!-- clinic marker -->
  <g transform="translate(470 175)">
    <path d="M0 0 C 38 0, 60 26, 60 56 C 60 92, 0 130, 0 130 C 0 130, -60 92, -60 56 C -60 26, -38 0, 0 0 Z" fill="#1F7A70"/>
    <circle cx="0" cy="52" r="26" fill="#FFFFFF"/>
    <path d="M0 38 v28 M-14 52 h28" stroke="#1F7A70" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="470" y="330" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1F2A33" text-anchor="middle">わかば整骨院</text>

  <!-- parking marker -->
  <rect x="560" y="150" width="44" height="44" rx="6" fill="#3C7DBF"/>
  <text x="582" y="182" font-family="sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text>

  <rect x="1" y="1" width="798" height="478" fill="none" stroke="#1F7A70" stroke-opacity="0.2" stroke-width="2"/>
</svg>
