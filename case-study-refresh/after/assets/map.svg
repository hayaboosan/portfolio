<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="わかば整骨院の周辺地図。わかば駅東口から大通りを東へ徒歩5分、わかばビル1階。">
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6F5"/>
      <stop offset="1" stop-color="#E2EFED"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#mapbg)"/>

  <g font-family="sans-serif">

    <!-- 街区内の建物（雰囲気づくり） -->
    <g fill="#DEE9E6">
      <rect x="300" y="58" width="64" height="44" rx="3"/>
      <rect x="398" y="46" width="54" height="38" rx="3"/>
      <rect x="488" y="66" width="62" height="42" rx="3"/>
      <rect x="636" y="52" width="68" height="46" rx="3"/>
      <rect x="660" y="130" width="56" height="40" rx="3"/>
      <rect x="168" y="330" width="56" height="38" rx="3"/>
      <rect x="320" y="290" width="64" height="42" rx="3"/>
      <rect x="420" y="300" width="56" height="40" rx="3"/>
      <rect x="650" y="300" width="64" height="44" rx="3"/>
      <rect x="640" y="380" width="56" height="40" rx="3"/>
    </g>

    <!-- わかば公園（道路に面した街区の中） -->
    <rect x="110" y="50" width="125" height="150" rx="10" fill="#C7E6C9"/>
    <g fill="#A3D6A8">
      <circle cx="140" cy="92" r="12"/>
      <circle cx="186" cy="128" r="16"/>
      <circle cx="150" cy="162" r="10"/>
    </g>
    <text x="172" y="188" font-size="15" fill="#3A6B4A" text-anchor="middle">わかば公園</text>

    <!-- 道路（縁取り→白の順で交差点をつなげる。すべて画面端まで連続） -->
    <g stroke="#CBDBD7" fill="none">
      <line x1="0" y1="240" x2="800" y2="240" stroke-width="46"/>
      <line x1="260" y1="0" x2="260" y2="480" stroke-width="28"/>
      <line x1="600" y1="0" x2="600" y2="480" stroke-width="28"/>
    </g>
    <g stroke="#FFFFFF" fill="none">
      <line x1="0" y1="240" x2="800" y2="240" stroke-width="40"/>
      <line x1="260" y1="0" x2="260" y2="480" stroke-width="24"/>
      <line x1="600" y1="0" x2="600" y2="480" stroke-width="24"/>
    </g>
    <text x="788" y="245" font-size="12" fill="#9CB0AB" text-anchor="end">大通り</text>

    <!-- 鉄道（南北に走り、大通りとは踏切で交差） -->
    <line x1="72" y1="0" x2="72" y2="480" stroke="#6E7E7A" stroke-width="10"/>
    <line x1="72" y1="0" x2="72" y2="480" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 10"/>

    <!-- わかば駅（線路上・大通りに面する） -->
    <rect x="38" y="270" width="112" height="70" rx="8" fill="#5A6B7A"/>
    <text x="94" y="312" font-size="16" fill="#FFFFFF" text-anchor="middle">わかば駅</text>
    <rect x="118" y="261" width="36" height="18" rx="9" fill="#FFFFFF" stroke="#5A6B7A"/>
    <text x="136" y="274" font-size="10" fill="#41525F" text-anchor="middle">東口</text>

    <!-- 徒歩ルート（東口→大通りを東へ→整骨院） -->
    <path d="M142 261 L142 240 L470 240 L470 224" fill="none" stroke="#1F7A70" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
    <text x="300" y="213" font-size="13" font-weight="bold" fill="#1F7A70" text-anchor="middle">徒歩5分</text>

    <!-- わかば整骨院（大通り沿い・わかばビル1F） -->
    <rect x="420" y="162" width="100" height="58" rx="4" fill="#FFFFFF" stroke="#1F7A70" stroke-width="2.5"/>
    <text x="470" y="190" font-size="14" font-weight="bold" fill="#1F7A70" text-anchor="middle">わかば整骨院</text>
    <text x="470" y="207" font-size="10" fill="#6B7B78" text-anchor="middle">わかばビル1F</text>
    <path d="M470 158 L456 138 L484 138 Z" fill="#1F7A70"/>
    <circle cx="470" cy="126" r="16" fill="#1F7A70"/>
    <path d="M470 117 v18 M461 126 h18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- 駐車場（建物となり・2台） -->
    <rect x="524" y="170" width="56" height="50" rx="4" fill="#EDF3F1" stroke="#8FA8A2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="540" y="176" width="24" height="24" rx="4" fill="#3C7DBF"/>
    <text x="552" y="194" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text>

    <!-- コンビニ（交差点角の目印） -->
    <rect x="196" y="272" width="48" height="34" rx="3" fill="#F5E8CD" stroke="#D9C28F"/>
    <text x="220" y="320" font-size="10" fill="#8A754A" text-anchor="middle">コンビニ</text>

  </g>

  <rect x="1" y="1" width="798" height="478" fill="none" stroke="#1F7A70" stroke-opacity="0.2" stroke-width="2"/>
</svg>
