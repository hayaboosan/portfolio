<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#E8F3F2"/>
      <stop offset="0.55" stop-color="#D2E9E6"/>
      <stop offset="1" stop-color="#BBDDDA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C9C90"/>
      <stop offset="1" stop-color="#1F7A70"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <!-- gentle horizon arcs -->
  <g fill="none" stroke="#2C9C90" stroke-opacity="0.12" stroke-width="2">
    <path d="M-100 760 C 380 700, 1180 820, 1760 720"/>
    <path d="M-100 870 C 460 810, 1080 930, 1760 830"/>
    <path d="M-100 980 C 360 920, 1220 1040, 1760 940"/>
  </g>

  <!-- large soft circle (calm focal point) -->
  <circle cx="1230" cy="300" r="240" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="1230" cy="300" r="240" fill="none" stroke="#2C9C90" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="1230" cy="300" r="330" fill="none" stroke="#2C9C90" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- young leaf motif (わかば = young leaf), echoing the clinic name -->
  <g transform="translate(1170 240) rotate(8)">
    <path d="M60 0 C 150 30, 175 150, 90 250 C 30 165, 0 70, 60 0 Z" fill="url(#leaf)" fill-opacity="0.9"/>
    <path d="M70 28 C 78 110, 80 180, 84 232" fill="none" stroke="#E8F3F2" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
    <path d="M73 92 C 100 84, 120 92, 134 110" fill="none" stroke="#E8F3F2" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M77 150 C 102 144, 122 152, 138 172" fill="none" stroke="#E8F3F2" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- botanical sprig, lower-left -->
  <g stroke="#1F7A70" stroke-opacity="0.22" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M210 1100 C 250 880, 300 760, 380 640"/>
    <path d="M300 860 C 250 810, 210 794, 168 812"/>
    <path d="M330 770 C 386 716, 432 700, 488 716"/>
    <path d="M356 690 C 306 648, 264 632, 224 648"/>
  </g>
  <g fill="#2C9C90" fill-opacity="0.16">
    <ellipse cx="164" cy="808" rx="40" ry="15" transform="rotate(-30 164 808)"/>
    <ellipse cx="492" cy="712" rx="42" ry="15" transform="rotate(26 492 712)"/>
    <ellipse cx="220" cy="646" rx="38" ry="14" transform="rotate(-34 220 646)"/>
  </g>
</svg>
