<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9c4"/>
      <stop offset="1" stop-color="#f0d099"/>
    </linearGradient>
  </defs>
  <rect width="600" height="160" fill="url(#bg)"/>
  <rect y="120" width="600" height="40" fill="#d8b070"/>
  <!-- どんぶり風 -->
  <g transform="translate(95,82)">
    <ellipse cx="0" cy="34" rx="60" ry="14" fill="#8a5a2b"/>
    <path d="M-58 18 C -50 50 50 50 58 18 Z" fill="#c0392b"/>
    <ellipse cx="0" cy="18" rx="58" ry="16" fill="#e8c98a"/>
    <ellipse cx="0" cy="14" rx="40" ry="9" fill="#fff5e0"/>
  </g>
  <!-- テキスト焼き込み -->
  <text x="210" y="64" font-family="'MS PGothic','HG行書体',serif" font-size="28" font-weight="bold" fill="#7a1f12">町の台所、ますだ食堂</text>
  <text x="212" y="98" font-family="'MS PGothic',serif" font-size="16" fill="#6a4a1d">昔ながらの定食と、ちょっと一杯。</text>
  <rect x="0" y="0" width="600" height="160" fill="none" stroke="#c89b4a" stroke-width="3"/>
</svg>
