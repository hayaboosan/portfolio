<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" preserveAspectRatio="xMidYMid slice">
  <!-- 「メニューを画像1枚に文字焼き込み」＝更新不能・読み上げ不可の再現 -->
