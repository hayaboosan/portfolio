  <rect x="6" y="6" width="548" height="368" fill="none" stroke="#c0392b" stroke-width="4"/>
  <rect x="14" y="14" width="532" height="352" fill="none" stroke="#d89a2e" stroke-width="2"/>
  <text x="280" y="58" text-anchor="middle" font-family="'MS PGothic','HG行書体',serif" font-size="34" font-weight="bold" fill="#7a1f12">お　し　な　が　き</text>
  <line x1="80" y1="78" x2="480" y2="78" stroke="#c0392b" stroke-width="1"/>
