<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FBF4E6"/>
      <stop offset="0.55" stop-color="#F4E7CC"/>
      <stop offset="1" stop-color="#ECD8B0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.24" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#234C6E"/>
      <stop offset="1" stop-color="#1B3A5B"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <!-- steam-like soft arcs -->
  <g fill="none" stroke="#C4452F" stroke-opacity="0.1" stroke-width="2.4">
    <path d="M-100 760 C 380 700, 1180 820, 1760 720"/>
    <path d="M-100 880 C 460 820, 1080 940, 1760 840"/>
    <path d="M-100 1000 C 360 940, 1220 1060, 1760 960"/>
  </g>

  <!-- noren motif top-right (暖簾) -->
  <g transform="translate(1140 90)">
    <rect x="-20" y="0" width="460" height="34" rx="6" fill="#1B3A5B"/>
    <g fill="#1B3A5B" fill-opacity="0.92">
      <rect x="0" y="34" width="120" height="300" rx="6"/>
      <rect x="150" y="34" width="120" height="300" rx="6"/>
      <rect x="300" y="34" width="120" height="300" rx="6"/>
    </g>
    <text x="60" y="170" font-family="serif" font-size="78" fill="#FBF4E6" text-anchor="middle">食</text>
    <text x="210" y="170" font-family="serif" font-size="78" fill="#FBF4E6" text-anchor="middle">堂</text>
    <circle cx="360" cy="150" r="40" fill="#D89A2E"/>
  </g>

  <!-- big plate of food (focal point) -->
  <g transform="translate(1210 640)">
    <ellipse cx="0" cy="36" rx="300" ry="70" fill="#1B3A5B" fill-opacity="0.12"/>
    <circle cx="0" cy="0" r="250" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="0" cy="0" r="250" fill="none" stroke="#1B3A5B" stroke-opacity="0.15" stroke-width="3"/>
    <!-- grilled fish -->
    <g transform="rotate(-18)">
      <path d="M-150 0 C -90 -60, 90 -60, 150 0 C 90 60, -90 60, -150 0 Z" fill="#E8C98A"/>
      <path d="M150 0 l 56 -34 l 0 68 Z" fill="#D89A2E"/>
      <g stroke="#9A6A16" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5">
        <path d="M-90 -10 L -50 -2"/>
        <path d="M-50 6 L -10 12"/>
        <path d="M-10 -10 L 30 -2"/>
        <path d="M30 6 L 70 12"/>
      </g>
      <circle cx="-110" cy="-6" r="8" fill="#5A160D"/>
    </g>
    <!-- garnish -->
    <circle cx="-150" cy="120" r="30" fill="#C4452F" fill-opacity="0.85"/>
    <ellipse cx="140" cy="120" rx="48" ry="22" fill="#4F7A3A" fill-opacity="0.7"/>
  </g>

  <!-- chopsticks lower-left -->
  <g stroke="#8A5A2B" stroke-width="10" stroke-linecap="round" stroke-opacity="0.5">
    <path d="M120 1080 L 520 700"/>
    <path d="M170 1090 L 570 710"/>
  </g>

  <!-- small bowl -->
  <g transform="translate(250 760)">
    <path d="M-90 -10 C -78 60 78 60 90 -10 Z" fill="url(#bowl)"/>
    <ellipse cx="0" cy="-10" rx="90" ry="22" fill="#234C6E"/>
    <ellipse cx="0" cy="-14" rx="68" ry="14" fill="#FBF4E6" fill-opacity="0.85"/>
  </g>
</svg>
