<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="ますだ食堂の周辺地図。なかまち駅北口から市場どおり商店街を北へ徒歩3分、大通りとの角。">
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF4E6"/>
      <stop offset="1" stop-color="#F3E6CB"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#mapbg)"/>

  <g font-family="sans-serif">

    <!-- 街区内の建物（雰囲気づくり） -->
    <g fill="#ECDFC3">
      <rect x="450" y="60" width="64" height="44" rx="3"/>
      <rect x="544" y="52" width="58" height="40" rx="3"/>
      <rect x="450" y="128" width="56" height="38" rx="3"/>
      <rect x="664" y="60" width="62" height="46" rx="3"/>
      <rect x="696" y="140" width="56" height="40" rx="3"/>
      <rect x="60" y="290" width="60" height="42" rx="3"/>
      <rect x="150" y="292" width="56" height="40" rx="3"/>
      <rect x="292" y="282" width="52" height="38" rx="3"/>
      <rect x="476" y="300" width="52" height="38" rx="3"/>
    </g>

    <!-- 中町公園（道路に面した街区の中） -->
    <rect x="50" y="45" width="180" height="135" rx="10" fill="#CFE3B6"/>
    <g fill="#9CC97E">
      <circle cx="95" cy="85" r="13"/>
      <circle cx="145" cy="120" r="16"/>
      <circle cx="190" cy="80" r="11"/>
    </g>
    <text x="140" y="162" font-size="15" fill="#3F6B33" text-anchor="middle">中町公園</text>

    <!-- 道路（縁取り→白の順で交差点をつなげる。市場どおりは駅前から北へ延びる通り） -->
    <g stroke="#DCC9A0" fill="none">
      <line x1="0" y1="235" x2="800" y2="235" stroke-width="44"/>
      <line x1="260" y1="0" x2="260" y2="480" stroke-width="26"/>
      <line x1="640" y1="0" x2="640" y2="480" stroke-width="26"/>
      <line x1="400" y1="0" x2="400" y2="362" stroke-width="30"/>
    </g>
    <g stroke="#FFFFFF" fill="none">
      <line x1="0" y1="235" x2="800" y2="235" stroke-width="40"/>
      <line x1="260" y1="0" x2="260" y2="480" stroke-width="22"/>
      <line x1="640" y1="0" x2="640" y2="480" stroke-width="22"/>
      <line x1="400" y1="0" x2="400" y2="362" stroke-width="26"/>
    </g>
    <text x="788" y="240" font-size="12" fill="#B59A6B" text-anchor="end">大通り</text>

    <!-- 市場どおり商店街（通り沿いの縦書きラベル） -->
    <text x="426" y="48" font-size="13" fill="#A06A2C">
      <tspan x="426" y="48">市</tspan><tspan x="426" y="64">場</tspan><tspan x="426" y="80">ど</tspan><tspan x="426" y="96">お</tspan><tspan x="426" y="112">り</tspan><tspan x="426" y="128">商</tspan><tspan x="426" y="144">店</tspan><tspan x="426" y="160">街</tspan>
    </text>

    <!-- 商店街アーケードゲート -->
    <g fill="#C4452F">
      <rect x="383" y="316" width="6" height="32"/>
      <rect x="411" y="316" width="6" height="32"/>
      <rect x="378" y="308" width="44" height="10" rx="3"/>
    </g>

    <!-- 鉄道（東西に走る）と なかまち駅 -->
    <line x1="0" y1="428" x2="800" y2="428" stroke="#5B5347" stroke-width="10"/>
    <line x1="0" y1="428" x2="800" y2="428" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 10"/>
    <rect x="300" y="362" width="200" height="62" rx="8" fill="#1B3A5B"/>
    <text x="400" y="400" font-size="17" fill="#FFFFFF" text-anchor="middle">なかまち駅</text>
    <rect x="382" y="353" width="36" height="18" rx="9" fill="#FFFFFF" stroke="#1B3A5B"/>
    <text x="400" y="366" font-size="10" fill="#1B3A5B" text-anchor="middle">北口</text>

    <!-- 徒歩ルート（北口→商店街を北へ→ますだ食堂） -->
    <path d="M400 351 L400 184 L376 184" fill="none" stroke="#C4452F" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
    <text x="418" y="300" font-size="13" font-weight="bold" fill="#C4452F" text-anchor="start">徒歩3分</text>

    <!-- ますだ食堂（商店街の中ほど・大通りとの角、赤いのれんが目印） -->
    <rect x="300" y="158" width="72" height="54" rx="4" fill="#FFFFFF" stroke="#C4452F" stroke-width="2.5"/>
    <rect x="363" y="170" width="7" height="28" fill="#C4452F"/>
    <path d="M336 154 L324 136 L348 136 Z" fill="#C4452F"/>
    <circle cx="336" cy="124" r="15" fill="#C4452F"/>
    <path d="M325 122 C 328 134 344 134 347 122 Z" fill="#FFFFFF"/>
    <ellipse cx="336" cy="122" rx="11" ry="3.5" fill="#FFFFFF"/>
    <text x="336" y="96" font-size="17" font-weight="bold" fill="#1B3A5B" text-anchor="middle">ますだ食堂</text>

    <!-- バス停（大通り沿い） -->
    <line x1="560" y1="260" x2="560" y2="288" stroke="#8A6A33" stroke-width="3"/>
    <circle cx="560" cy="251" r="10" fill="#D89A2E" stroke="#FFFFFF" stroke-width="2"/>
    <text x="560" y="255" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
    <text x="560" y="305" font-size="12" fill="#8A5A2B" text-anchor="middle">バス停</text>

  </g>

  <rect x="1" y="1" width="798" height="478" fill="none" stroke="#1B3A5B" stroke-opacity="0.2" stroke-width="2"/>
</svg>
