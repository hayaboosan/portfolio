<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E6"/>
      <stop offset="1" stop-color="#F1E2C4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99A5E"/>
      <stop offset="1" stop-color="#B07F45"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C98A"/>
      <stop offset="1" stop-color="#D8B070"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#wall)"/>
  <rect y="400" width="800" height="160" fill="url(#floor)"/>

  <!-- noren at entrance -->
  <g transform="translate(60 60)">
    <rect x="0" y="0" width="200" height="14" rx="4" fill="#1B3A5B"/>
    <rect x="6" y="14" width="56" height="150" rx="4" fill="#1B3A5B" fill-opacity="0.92"/>
    <rect x="72" y="14" width="56" height="150" rx="4" fill="#1B3A5B" fill-opacity="0.92"/>
    <rect x="138" y="14" width="56" height="150" rx="4" fill="#1B3A5B" fill-opacity="0.92"/>
    <text x="34" y="80" font-family="serif" font-size="34" fill="#FBF4E6" text-anchor="middle">ま</text>
    <text x="100" y="80" font-family="serif" font-size="34" fill="#FBF4E6" text-anchor="middle">す</text>
    <text x="166" y="80" font-family="serif" font-size="34" fill="#FBF4E6" text-anchor="middle">だ</text>
  </g>

  <!-- paper lantern (提灯) -->
  <g transform="translate(640 130)">
    <line x1="0" y1="-70" x2="0" y2="-40" stroke="#5A160D" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="50" ry="62" fill="#C4452F"/>
    <g stroke="#7A1F12" stroke-width="2" stroke-opacity="0.5" fill="none">
      <path d="M-48 -24 H 48"/><path d="M-50 0 H 50"/><path d="M-48 24 H 48"/>
    </g>
    <rect x="-22" y="-66" width="44" height="10" rx="3" fill="#1B3A5B"/>
    <rect x="-22" y="56" width="44" height="10" rx="3" fill="#1B3A5B"/>
    <text x="0" y="10" font-family="serif" font-size="34" fill="#FBF4E6" text-anchor="middle">食</text>
  </g>

  <!-- counter table -->
  <rect x="120" y="330" width="560" height="44" rx="10" fill="url(#table)"/>
  <rect x="120" y="330" width="560" height="44" rx="10" fill="none" stroke="#9A6A16" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="150" y="374" width="16" height="70" fill="#9A6A16"/>
  <rect x="634" y="374" width="16" height="70" fill="#9A6A16"/>

  <!-- dishes on counter -->
  <g>
    <circle cx="250" cy="324" r="26" fill="#FFFFFF"/>
    <circle cx="250" cy="324" r="26" fill="none" stroke="#1B3A5B" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="250" cy="324" r="14" fill="#D89A2E" fill-opacity="0.8"/>
  </g>
  <g>
    <path d="M380 326 C 392 350 428 350 440 326 Z" fill="#1B3A5B"/>
    <ellipse cx="410" cy="326" rx="30" ry="8" fill="#234C6E"/>
    <ellipse cx="410" cy="324" rx="22" ry="5" fill="#FBF4E6" fill-opacity="0.8"/>
  </g>
  <g>
    <rect x="520" y="306" width="64" height="20" rx="4" fill="#C4452F" fill-opacity="0.85"/>
    <rect x="520" y="306" width="64" height="20" rx="4" fill="none" stroke="#7A1F12" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- stools -->
  <g fill="#1B3A5B">
    <rect x="232" y="400" width="36" height="12" rx="4"/>
    <rect x="246" y="412" width="8" height="40"/>
    <rect x="392" y="400" width="36" height="12" rx="4"/>
    <rect x="406" y="412" width="8" height="40"/>
    <rect x="532" y="400" width="36" height="12" rx="4"/>
    <rect x="546" y="412" width="8" height="40"/>
  </g>
</svg>
